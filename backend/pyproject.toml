[project]
name = "idea-workbench-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # TestClient transport — dev only, never imported at runtime.
    # httpx2, not httpx: starlette deprecated the latter for TestClient.
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
